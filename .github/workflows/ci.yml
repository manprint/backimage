name: CI

on:
  push:
    branches: [main]
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOFLAGS: -mod=readonly

jobs:
  quality:
    name: quality and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          install-only: true
      - name: Download dependencies
        run: go mod download
      - name: Full project gate
        run: make check
      - name: Coverage report
        run: make cover PKG=./...
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.sha }}
          path: coverage.out
          if-no-files-found: ignore

  cross-build:
    name: cross-platform builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quality
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: make build-all
      - run: make embed
      - uses: actions/upload-artifact@v4
        with:
          name: cross-build-${{ github.sha }}
          path: |
            dist/**
            bin/backimage
            internal/embedded/backimage-selfextract-*

  e2e:
    name: e2e phase ${{ matrix.phase }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        phase: ['00', '01', '04', '05', '06', '07', '08', '09', '10']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build test binary
        run: make embed
      - name: Run E2E phase
        run: make e2e PHASE=${{ matrix.phase }}
