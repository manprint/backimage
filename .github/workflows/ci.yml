name: CI

on:
  push:
    branches: ['**']
    tags: ['v[0-9]+.[0-9]+.[0-9]+', 'v[0-9]+.[0-9]+.[0-9]+-*']
  pull_request:
    branches: ['**']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOFLAGS: -mod=readonly

jobs:
  quality:
    name: quality and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.1.6
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
      - name: Download dependencies
        run: go mod download
      - name: Install protobuf toolchain
        run: |
          curl -fsSL -o /tmp/protoc.zip https://github.com/protocolbuffers/protobuf/releases/download/v27.3/protoc-27.3-linux-x86_64.zip
          rm -rf /tmp/backimage-protoc
          unzip -q /tmp/protoc.zip -d /tmp/backimage-protoc
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.34.2
          echo "/tmp/backimage-protoc/bin" >> "$GITHUB_PATH"
          echo "$HOME/go/bin" >> "$GITHUB_PATH"
      - name: Build embedded self-extract assets
        run: make embed
      - name: Full project gate
        # proto-check skips when protoc is missing so the local gate stays
        # runnable; in CI the toolchain is installed above and a skip must be a
        # failure, not a silently missing check.
        env:
          BACKIMAGE_REQUIRE_PROTOC: '1'
        run: make check
      - name: Coverage report
        run: make cover PKG=./...
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.sha }}
          path: coverage.out
          if-no-files-found: ignore

  cross-build:
    name: cross-platform builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quality
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: make build-all
      - run: make embed
      - uses: actions/upload-artifact@v4
        with:
          name: cross-build-${{ github.sha }}
          path: |
            dist/**
            bin/backimage
            internal/embedded/backimage-selfextract-*

  windows:
    name: windows build and unit tests
    runs-on: windows-latest
    timeout-minutes: 30
    needs: quality
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        run: go build ./cmd/... ./pkg/... ./internal/...
      - name: Build embedded self-extract assets
        # The assets are Linux binaries whatever the runner is: without them
        # the CLI tests that build a runnable image fail on a placeholder.
        shell: bash
        run: |
          for arch in amd64 arm64; do
            # go build refuses to overwrite the committed placeholder, which
            # is not an object file; the Makefile removes it for the same
            # reason.
            rm -f internal/embedded/backimage-selfextract-linux-$arch
            GOOS=linux GOARCH=$arch go build \
              -o internal/embedded/backimage-selfextract-linux-$arch \
              ./cmd/backimage-selfextract
          done
      - name: Unit tests
        # The extraction path is a different implementation on Windows, and a
        # green Linux run says nothing about it: until this job existed, the
        # selective restore was broken there and no gate could notice.
        #
        # internal/embedded is left out on purpose: it asserts that the
        # embedded Linux extractors were rebuilt from this tree, which is what
        # `make embed` does on the Linux jobs.
        shell: bash
        run: go test $(go list ./pkg/... ./internal/... | grep -v internal/embedded)
      - name: Extraction tests, verbose
        run: go test -v -run TestWindows ./pkg/archive/

  macos:
    name: macos build and unit tests
    runs-on: macos-latest
    timeout-minutes: 30
    needs: quality
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build both architectures
        run: |
          GOOS=darwin GOARCH=amd64 go build ./cmd/... ./pkg/... ./internal/...
          GOOS=darwin GOARCH=arm64 go build ./cmd/... ./pkg/... ./internal/...
      - name: Build embedded self-extract assets
        # The assets are Linux binaries whatever the runner is: without them
        # the CLI tests that build a runnable image fail on a placeholder.
        shell: bash
        run: |
          for arch in amd64 arm64; do
            # go build refuses to overwrite the committed placeholder, which
            # is not an object file; the Makefile removes it for the same
            # reason.
            rm -f internal/embedded/backimage-selfextract-linux-$arch
            GOOS=linux GOARCH=$arch go build \
              -o internal/embedded/backimage-selfextract-linux-$arch \
              ./cmd/backimage-selfextract
          done
      - name: Unit tests
        # internal/embedded is left out for the same reason as on Windows.
        shell: bash
        run: go test $(go list ./pkg/... ./internal/... | grep -v internal/embedded)

  e2e:
    name: e2e phase ${{ matrix.phase }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        phase: ['00', '01', '04', '05', '06', '07', '08', '08_stream', '09', '10', '13', 'A1', 'A2', 'A3', 'A4', 'A5']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Enable foreign-architecture containers
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - name: Build test binary
        run: make embed
      - name: Run E2E phase
        run: make e2e PHASE=${{ matrix.phase }}
