name: CI

on:
  push:
    branches: ['**']
    tags: ['v[0-9]+.[0-9]+.[0-9]+', 'v[0-9]+.[0-9]+.[0-9]+-*']
  pull_request:
    branches: ['**']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOFLAGS: -mod=readonly

jobs:
  quality:
    name: quality and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.8
      - name: Download dependencies
        run: go mod download
      - name: Install protobuf toolchain
        run: |
          curl -fsSL -o /tmp/protoc.zip https://github.com/protocolbuffers/protobuf/releases/download/v27.3/protoc-27.3-linux-x86_64.zip
          rm -rf /tmp/backimage-protoc
          unzip -q /tmp/protoc.zip -d /tmp/backimage-protoc
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.34.2
          echo "/tmp/backimage-protoc/bin" >> "$GITHUB_PATH"
          echo "$HOME/go/bin" >> "$GITHUB_PATH"
      - name: Build embedded self-extract assets
        run: make embed
      - name: Full project gate
        run: make check
      - name: Coverage report
        run: make cover PKG=./...
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.sha }}
          path: coverage.out
          if-no-files-found: ignore

  cross-build:
    name: cross-platform builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quality
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: make build-all
      - run: make embed
      - uses: actions/upload-artifact@v4
        with:
          name: cross-build-${{ github.sha }}
          path: |
            dist/**
            bin/backimage
            internal/embedded/backimage-selfextract-*

  e2e:
    name: e2e phase ${{ matrix.phase }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        phase: ['00', '01', '04', '05', '06', '07', '08', '08_stream', '09', '10']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Enable foreign-architecture containers
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - name: Build test binary
        run: make embed
      - name: Run E2E phase
        run: make e2e PHASE=${{ matrix.phase }}
