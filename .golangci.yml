run:
  timeout: 10m

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign
    - gosimple
    - misspell
    - revive
    - gosec
    - bodyclose
    - errorlint
    - contextcheck
    - noctx
    - copyloopvar
    - durationcheck
    - makezero
    - prealloc

linters-settings:
  errcheck:
    check-blank: true
  revive:
    rules:
      - name: exported
  gosec:
    excludes:
      - G304   # file path from user input is this program's job
      - G306   # WriteFile perms: fixtures mirror real-world 0644 trees; program writes are covered

issues:
  exclude-rules:
    - path: _test\.go$
      linters:
        - gosec
        - errcheck
    - linters:
        - gosec
      text: G115 # numeric conversions on kernel-provided stat/header fields are bounded
    - linters:
      path: test/fixtures/compare.go
      text: raced removal